[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[project]
name = "upload-broker"
version = "0.1.0"
description = "Hand out presigned S3 upload URLs to authenticated clients"
authors = [
    {name="Yaal Coop", email="contact@yaal.coop"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    "boto3>=1.43.109",
    "fastapi>=0.143.0",
    "granian>=2.8.4",
    "joserfc>=1.7.5",
    "pydantic-settings>=2.15.0",
]

[project.urls]
repository = "https://github.com/yaal-coop/upload-broker"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "moto[server]>=5.2.3",
    "mypy>=2.4.0",
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "time-machine>=3.5.1",
    "tox-uv-bare>=1.36.1",
    "types-boto3[s3]>=1.43.109",
]

[tool.uv]
required-version = ">=0.13.4"
exclude-newer = "14 days"

[tool.mypy]
plugins = [
  "pydantic.mypy"
]
files = ["src", "tests"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.coverage.run]
source = [
    "upload_broker",
    "tests",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "@pytest.mark.skip",
    "@pytest.mark.xfail",
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.\\s*$", # ignore ellipsis
]

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # line-too-long
    "E722", # bare-except
    "D100", # public module
    "D101", # public class
    "D102", # public method
    "D103", # public function
    "D104", # public package
    "D105", # magic method
    "D106", # nested class
    "D107", # public init
    "D203", # no-blank-line-before-class
    "D213", # multi-line-summary-second-line
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "--showlocals"

[tool.tox]
requires = ["tox>=4.19"]
env_list = [
    "style",
    "py314",
    "coverage",
]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [
    ["pytest", "--full-trace", "{posargs}"],
]

[tool.tox.env.style]
runner = "uv-venv-runner"
commands = [
    ["prek", "run", "--all-files", "--show-diff-on-failure"],
]

[tool.tox.env.coverage]
commands = [
    ["pytest", "--cov", "--cov-fail-under=100", "--cov-report", "term:skip-covered", "{posargs}"],
    ["coverage", "html"],
]
